name: Build VPN-TEIVRIM

on:
  push:
    branches: [ main, master, drafts ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      - name: Configure (CMake)
        shell: msys2 {0}
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --config Release -- -j4

      - name: Check binary
        shell: pwsh
        run: |
          Get-ChildItem build -Recurse | Format-Table
          if (!(Test-Path "build/VPN-TEIVRIM.exe")) { throw "binary not found" }
          $sz = (Get-Item "build/VPN-TEIVRIM.exe").Length / 1MB
          $szMb = [math]::Round($sz,3)
          Write-Host "Binary size: $szMb MB"
          if ($sz -gt 2) { throw "binary >2MB limit failed: $szMb MB" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Package ZIP
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(VPN-TEIVRIM VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $zip = "VPN-TEIVRIM-v$ver-win64.zip"
          Compress-Archive -Path build/VPN-TEIVRIM.exe,README.md,vpn-*.ps1,vpn-*.bat,install.bat,uninstall.bat -DestinationPath $zip
          if (!(Test-Path $zip)) { throw "ZIP was not created" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipItems = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            if (!($zipItems.Entries | Where-Object FullName -eq 'VPN-TEIVRIM.exe')) { throw "VPN-TEIVRIM.exe missing from ZIP" }
          } finally { $zipItems.Dispose() }
          Write-Host "Created $zip"
          Get-Item $zip | Format-List

      - name: Build Setup.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          $setup = Get-ChildItem release/VPN-TEIVRIM-*-setup.exe
          if (!$setup) { throw "Setup.exe was not created" }
          $setup | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: VPN-TEIVRIM-win64
          path: |
            build/VPN-TEIVRIM.exe
            VPN-TEIVRIM-*.zip
            release/VPN-TEIVRIM-*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VPN-TEIVRIM-*.zip
            release/VPN-TEIVRIM-*.exe
          generate_release_notes: true
